# Dependency updates. Every PR gets the builds and unit tests (the chain suites run once it is on main), and each update is a
# supply-chain change to review before merging. Major versions of crates and npm packages are left to planned upgrades.
# Version updates wait 14 days after a release, so a hijacked release has time to be caught; security updates don't wait.
# programs/ gets no version updates: the mainnet escrow is immutable, and that workspace is pinned to Rust 1.95 and Anchor's
# template lockfile, so bumps there change nothing deployed. Alerts still cover it.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /cli
      - /client/wasm
      - /maker
      - /shared/chain
      - /shared/rfq
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # A major version changes an API, so it is a planned upgrade (the Solana 4.x crates, rand, ureq), not a weekly PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      tools:
        update-types: [minor, patch]

  # Actions are pinned by commit; updates move the pin and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]

  # The page's reproducible build image, pinned by digest. A new digest rebuilds the toolchain image and changes the page's bytes.
  - package-ecosystem: docker
    directory: /client/reproducible
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

name: Check the deploy scripts

on:
  push:
    branches: [main]
    paths: ['deploy/**', 'scripts/test-install-elements.sh', 'scripts/test-withdraw-usdt.sh', '.github/workflows/deploy-scripts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elements:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: shellcheck -S warning deploy/*.sh scripts/test-install-elements.sh scripts/test-withdraw-usdt.sh
      - name: Refuses anything but Elements' signed release
        run: scripts/test-install-elements.sh
      - name: Withdraws only with no swap open, and always resumes the maker
        run: scripts/test-withdraw-usdt.sh
      # A real install, on testnet: the service starts, answers on its own port with the password it printed, and is on the
      # right chain. A second run must change nothing.
      - name: Installs and runs a node
        run: |
          sudo deploy/install-elements.sh testnet --datadir /var/lib/elements-ci | tee out.txt
          password=$(sed -n 's/^  --elements-rpc liq2sol://p' out.txt)
          test -n "$password"
          for _ in $(seq 60); do
            /usr/local/bin/elements-cli -chain=liquidtestnet -rpcuser=liq2sol -rpcpassword="$password" getblockchaininfo > info.json 2>/dev/null && break
            sleep 2
          done
          jq -e '.chain == "liquidtestnet"' info.json
          sudo -u elements test -r /var/lib/elements-ci/elements.conf
          test "$(sudo stat -c %a /var/lib/elements-ci/elements.conf)" = 600
          sudo grep -qx 'txindex=1' /var/lib/elements-ci/elements.conf
          if sudo deploy/install-elements.sh testnet --datadir /var/lib/elements-ci; then echo 'a second run went ahead'; exit 1; fi
          sudo systemctl stop elementsd.service

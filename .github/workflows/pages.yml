# Builds the taker client from source, tests it, and publishes it to https://swapmarket.github.io/liq2sol/.
# Actions are pinned to exact commits, and the site's JavaScript has no build step, so what is served is what is in this repo,
# plus WebAssembly built here from the locked dependencies.
name: Deploy the client

on:
  push:
    branches: [main]
    paths:
      - client/**
      - contracts/swapkey/**
      - shared/chain/**
      - shared/rfq/**
      - programs/solana-escrow/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # A new push makes any deploy still running pointless.
  cancel-in-progress: true

env:
  RUST_VERSION: 1.99.1
  WASM_PACK_VERSION: 0.13.1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test how orders fill, and that swap records are never overwritten
        run: node --test client/test/plan.test.mjs client/test/store.test.mjs client/test/logs.test.mjs client/test/vetted.test.mjs
      # A marker saved only when this job succeeds, so a failure can't be skipped on the next run. The key covers everything these tests build.
      - name: Skip the native tests if they already passed on this code
        id: passed
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: client/wasm/.native-tests-passed
          key: native-tests-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('client/wasm/**', 'contracts/swapkey/**', 'shared/chain/**', 'shared/rfq/**', 'programs/solana-escrow/**') }}
      - name: Install the Rust toolchain
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Test Solana transactions against the native builders
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: client/wasm
        run: |
          cargo test --locked
          touch .native-tests-passed

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # A page-only change reuses the WebAssembly from an earlier run of this workflow. The key covers everything that goes into it
      # and the versions that build it, so any change to those builds it again.
      - name: Reuse the WebAssembly if nothing in it changed
        id: wasm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: client/site/wasm
          key: wasm-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ env.WASM_PACK_VERSION }}-${{ hashFiles('client/build.sh', 'client/wasm/**', 'contracts/swapkey/**', 'shared/chain/**', 'shared/rfq/**', 'programs/solana-escrow/**') }}
      - name: Reuse wasm-pack
        id: wasm-pack
        if: steps.wasm.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ env.WASM_PACK_VERSION }}
      - name: Install the Rust toolchain
        if: steps.wasm.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          sudo apt-get update -q
          sudo apt-get install -yq clang llvm
      - name: Install wasm-pack
        if: steps.wasm.outputs.cache-hit != 'true' && steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: Build the WebAssembly
        if: steps.wasm.outputs.cache-hit != 'true'
        run: client/build.sh
      - name: Stamp the build
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/g" client/site/index.html
      - name: Record what is being published
        working-directory: client/site
        run: |
          find . -type f | sort | xargs sha256sum > /tmp/SHA256SUMS
          cp /tmp/SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: client/site

  deploy:
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

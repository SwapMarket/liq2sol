# Builds the maker for Debian when a version tag is pushed, and the taker page reproducibly, and publishes them as a pre-release
# with checksums.
# It builds in Debian 12, because a binary needs a glibc no newer than the machine it runs on. Actions are pinned to exact commits.
# x86-64, and arm64 for a Raspberry Pi 4 or 5 with a 64-bit OS, each built natively on its own kind of runner.
name: Release the maker

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: rust:1.99.1-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the maker's rules and signer
        working-directory: maker
        run: cargo test --locked
      - name: Build
        working-directory: maker
        run: cargo build --release --locked
      - name: Check the binaries start on this architecture
        working-directory: maker
        run: |
          for b in liq2sol-maker liq2sol-signer; do
            out=$(target/release/$b /nonexistent/config.json 2>&1 || true)
            echo "$b: $out"
            echo "$out" | grep -q "stopped:"
          done
      - name: Package
        run: |
          name="liq2sol-maker-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          test "$(uname -m)" = "${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp maker/target/release/liq2sol-signer maker/target/release/liq2sol-maker deploy/* LICENSE "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          rm -r "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # The page at this tag, built reproducibly (client/reproducible), so the signed SHA256SUMS covers it too, and anyone can run it
  # on their own machine if the site is ever gone: see OFFLINE.md inside it.
  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The deploy keeps the toolchain image; without it, this builds it, which takes about 20 minutes.
      - name: Reuse the toolchain image
        id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/page-builder.tar
          key: page-builder-${{ hashFiles('client/reproducible/Dockerfile', 'client/reproducible/build-inside.sh', 'client/wasm/Cargo.lock') }}
      - name: Load it
        if: steps.image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/page-builder.tar
      - name: Build the page, as anyone can
        run: |
          name="liq2sol-page-${GITHUB_REF_NAME}"
          scripts/build-page.sh "$GITHUB_SHA" "dist/$name"
          cp client/reproducible/OFFLINE.md client/LICENSE "dist/$name/"
          cd dist
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "$name" | gzip -n > "$name.tar.gz"
          rm -r "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-page
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, page]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --title "$GITHUB_REF_NAME" \
            --notes "The liq2sol maker, for Debian 12 or later: x86_64, and aarch64 for a Raspberry Pi 4 or 5 with a 64-bit OS. For mainnet or the test networks, as its configs say; mainnet swaps are capped at 100 USDT. Installation, including a mainnet maker, is in README.md inside the archive. liq2sol-page-${GITHUB_REF_NAME}.tar.gz is the taker page at this tag, built reproducibly, to run on your own machine if the site is ever gone (OFFLINE.md inside). SHA256SUMS.asc, SwapMarket's signature, is added by hand after this."

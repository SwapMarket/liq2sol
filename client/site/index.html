<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: wss:; frame-src https://verify.walletconnect.org https://verify.walletconnect.com; base-uri 'none'; form-action 'none'">
<meta name="description" content="Trustless, confidential atomic swaps between USDt on Liquid and USDT on Solana. No server, no custodian.">
<title>liq2sol</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="logo" href="#swap"><img src="logo.svg" alt="liq2sol" width="107" height="28"></a>
    <!-- The burger and its styles are from SwapMarket/swapmarket.github.io, src/components/Nav.tsx and src/style/nav.scss (AGPL-3.0). -->
    <button id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="collapse">
      <svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true">
        <path class="line top" d="m 70,33 h -40 c 0,0 -8.5,-0.149796 -8.5,8.5 0,8.649796 8.5,8.5 8.5,8.5 h 20 v -20" />
        <path class="line middle" d="m 70,50 h -40" />
        <path class="line bottom" d="m 30,67 h 40 c 0,0 8.5,0.149796 8.5,-8.5 0,-8.649796 -8.5,-8.5 -8.5,-8.5 h -20 v 20" />
      </svg>
    </button>
    <div id="collapse">
      <a class="tab" data-tab="swap" href="#swap">Swap</a>
      <a class="tab" data-tab="rescue" href="#rescue">Rescue</a>
      <a class="tab" data-tab="history" href="#history">History</a>
      <a class="tab" data-tab="faucet" href="#faucet" hidden>Faucet</a>
      <a class="tab ext mainnet-only" href="https://swapmarket.github.io/sol2base/" data-site="sol2base" data-same-tab target="_blank" rel="noopener noreferrer" hidden>sol2base</a>
      <a class="tab ext mainnet-only" href="https://swapmarket.github.io/eth2base/" data-site="eth2base" data-same-tab target="_blank" rel="noopener noreferrer" hidden>eth2base</a>
      <a class="tab ext mainnet-only" href="https://swapmarket.github.io/sol2tron/" data-site="sol2tron" data-same-tab target="_blank" rel="noopener noreferrer" hidden>sol2tron</a>
      <a class="tab ext mainnet-only" href="https://swapmarket.github.io/" data-site="" data-same-tab target="_blank" rel="noopener noreferrer" hidden>Bitcoin</a>
    </div>
  </div>
</nav>
<main>
  <span class="net" id="net"></span>
  <div id="banner" class="banner" hidden></div>
  <section id="view">
    <div class="card page-loading" role="status" aria-label="Loading">
      <div class="skeleton short"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="spinner"></div>
      <p class="sub">Loading…</p>
      <noscript><p class="warn">This page needs JavaScript.</p></noscript>
    </div>
  </section>
  <section id="below"></section>
</main>
<footer>
  <p>No server and no custodian: your funds stay under keys only you and the chains control.</p>
  <p><a href="https://github.com/SwapMarket/liq2sol/tree/main/client" target="_blank" rel="noopener noreferrer">Source</a> under the AGPL-3.0. Build <a id="build" href="https://github.com/SwapMarket/liq2sol/commit/__BUILD__" target="_blank" rel="noopener noreferrer">__BUILD__</a>.<span data-nsite-note> Also on <a data-nsite="liq2sol" target="_blank" rel="noopener noreferrer">Nostr</a>.</span></p>
  <p>Built with ❤️ by Team SwapMarket</p>
</footer>
</body>
</html>

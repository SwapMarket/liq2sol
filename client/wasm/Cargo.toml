# What the browser runs. Blinding, signing and Nostr are the same Rust the maker and CLI use, so there is no second
# implementation to get wrong. Solana transactions are built here too, and tests compare them with the native builders byte for byte.
[package]
name = "liq2sol-client-wasm"
version = "0.1.0"
edition = "2021"
description = "liq2sol taker client: the protocol logic, compiled to WebAssembly"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
liq2sol-chain = { path = "../../shared/chain", default-features = false }
liq2sol-rfq = { path = "../../shared/rfq", default-features = false }
liq2sol-swapkey = { path = "../../contracts/swapkey" }
simplicityhl = "=0.9.0"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nostr = { version = "=0.45.7", features = ["std", "os-rng", "nip44"] }
sha2 = "0.10"
curve25519-dalek = { version = "4", default-features = false }
bs58 = "0.5"
# Browsers get randomness from crypto.getRandomValues, through this feature.
getrandom = { version = "0.2", features = ["js"] }
# The Nostr library needs a newer version too, and it has its own switch.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
universal-time = "0.3"
js-sys = "0.3"

[dev-dependencies]
liq2sol-chain = { path = "../../shared/chain" }
solana-escrow = { path = "../../programs/solana-escrow", features = ["no-entrypoint"] }
anchor-lang = "=1.2.2"
solana-sdk = "3"

# cargo-deny, for every Rust workspace here: `cargo deny --manifest-path <workspace>/Cargo.toml check bans licenses sources --config deny.toml`.
# Advisories are cargo-audit's job, in .github/workflows/audit.yml.

[licenses]
version = 2
# Permissive licences only. client/ is the one AGPL part, by the user's choice (LICENSE), so only that crate may use it.
allow = [
  "MIT", "MIT-0", "MITNFA", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0", "BSL-1.0", "Unlicense",
]
exceptions = [
  { allow = ["AGPL-3.0"], crate = "liq2sol-client-wasm" },
]

[bans]
# Solana's crates bring many versions of the same crate, and that is theirs to fix.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

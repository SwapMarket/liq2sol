[package]
name = "liq2sol-maker"
version = "0.1.0"
edition = "2021"
description = "liq2sol maker daemon: watches both chains and carries out the engine's decisions through the signer"
license = "MIT"
publish = false

[dependencies]
liq2sol-chain = { path = "../../shared/chain" }
liq2sol-swapkey = { path = "../../contracts/swapkey" }
liq2sol-maker-core = { path = "../core" }
liq2sol-rfq = { path = "../../shared/rfq" }
liq2sol-signer = { path = "../signer" }
nostr = { version = "=0.45.7", features = ["std", "os-rng", "nip44"] }
solana-escrow = { path = "../../programs/solana-escrow", features = ["no-entrypoint"] }
simplicityhl = "=0.9.0"
anchor-lang = "=1.2.2"
solana-sdk = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

[dev-dependencies]
serde_json = "1"

[package]
name = "liq2sol-signer"
version = "0.1.0"
edition = "2021"
description = "liq2sol maker signer: a separate process that holds the keys and enforces its own policy"
license = "MIT"
publish = false

[dependencies]
liq2sol-chain = { path = "../../shared/chain" }
liq2sol-swapkey = { path = "../../contracts/swapkey" }
liq2sol-maker-core = { path = "../core" }
solana-escrow = { path = "../../programs/solana-escrow", features = ["no-entrypoint"] }
simplicityhl = "=0.9.0"
anchor-lang = "=1.2.2"
solana-sdk = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]

# Separate from the root workspace: the Solana toolchain and its dependency graph are pinned independently.
[workspace]
members = ["solana-escrow", "devnet-faucet"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[package]
name = "solana-escrow"
version = "0.1.0"
description = "liq2sol HTLC escrow"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_escrow"

[features]
# Explorers label instructions from Anchor's log line. Everything else about a swap on Solana stays public.
default = ["no-log-ix-name"]
# Selects the real USDT mint. Never enabled for devnet or test builds.
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = "=1.2.2"
solana-secp256k1-recover = "3"
solana-sysvar = "3.1"

[dev-dependencies]
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4"
solana-last-restart-slot = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

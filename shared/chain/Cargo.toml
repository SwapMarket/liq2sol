# Used by both the CLI and the maker's signer, and needs both the Elements and the Solana dependency graphs.
[package]
name = "liq2sol-chain"
version = "0.1.0"
edition = "2021"
description = "Liquid and Solana plumbing shared by the liq2sol CLI and maker"
license = "MIT"
publish = false

[workspace]

[features]
default = ["native"]
# Blocking chain access and the Solana client. The browser client builds without it.
native = ["liq2sol-swapkey/secp256k1", "dep:solana-escrow", "dep:anchor-lang", "dep:anchor-spl", "dep:solana-client", "dep:solana-sdk", "dep:solana-commitment-config", "dep:solana-transaction-status-client-types", "dep:ureq", "dep:serde_json"]

[dependencies]
liq2sol-swapkey = { path = "../../contracts/swapkey", default-features = false }
rand = "0.8"
simplicityhl = "=0.9.0"
getrandom = "0.2"
solana-escrow = { path = "../../programs/solana-escrow", features = ["no-entrypoint"], optional = true }
anchor-lang = { version = "=1.2.2", optional = true }
anchor-spl = { version = "=1.2.2", optional = true }
solana-client = { version = "3", optional = true }
solana-sdk = { version = "3", optional = true }
solana-commitment-config = { version = "3", optional = true }
solana-transaction-status-client-types = { version = "3", optional = true }
ureq = { version = "2", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

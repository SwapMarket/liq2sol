# Schemas and rules shared by the maker and the taker. No chain dependencies, so it can be tested and fuzzed alone.
[package]
name = "liq2sol-rfq"
version = "0.1.0"
edition = "2021"
description = "liq2sol RFQ over Nostr: messages, validation and NIP-59 wrapping"
license = "MIT"
publish = false

[workspace]

[features]
default = ["native"]
# Talking to relays from native code. The browser client has its own WebSocket, and builds without this.
native = ["dep:tungstenite", "dep:rustls"]

[dependencies]
nostr = { version = "=0.45.7", features = ["std", "os-rng", "nip44"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
# tungstenite leaves the choice of TLS crypto to us, and connecting to a wss:// relay panics without one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
proptest = "1"
